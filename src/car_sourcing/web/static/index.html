<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourcing auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --paper: #EDF0F4; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D8DEE6; --line-strong: #B7C0CC;
  --ink: #15203A; --ink-2: #3B4760; --muted: #647089;
  --blue: #1D4FB0; --blue-ink: #FFFFFF; --blue-soft: #E2EAFA;
  --gain: #0B7A52; --gain-soft: #DCF2E8; --gain-bar: #19A571;
  --prio: #F5B800; --prio-soft: #FFF3C9; --prio-line: #D9A300;
  --stop: #B3372B; --stop-soft: #FBE5E1;
  --bar-buy: #15203A; --bar-fees: #5A6781; --bar-transport: #97A2B5; --bar-nego: #AEB8C7;
  --glass: #C9D6E8; --tyre: #232B3B; --hub: #C3CAD6;
  --scrim: rgba(12, 18, 32, .45);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --nav-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1420; --surface: #161E2E; --surface-2: #1B2537; --line: #283550; --line-strong: #3A4968;
    --ink: #E7ECF5; --ink-2: #B9C3D5; --muted: #8B97AE;
    --blue: #7EA6FF; --blue-ink: #0B1530; --blue-soft: #1D2A48;
    --gain: #54D6A0; --gain-soft: #123629; --gain-bar: #2FBF84;
    --prio: #FFC933; --prio-soft: #372E10; --prio-line: #E0AE1F;
    --stop: #FF8575; --stop-soft: #3B1D1A;
    --bar-buy: #D3DBEA; --bar-fees: #8594B2; --bar-transport: #5A6885; --bar-nego: #465471;
    --glass: #3C4D6B; --tyre: #05080F; --hub: #6B7890;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1420; --surface: #161E2E; --surface-2: #1B2537; --line: #283550; --line-strong: #3A4968;
  --ink: #E7ECF5; --ink-2: #B9C3D5; --muted: #8B97AE;
  --blue: #7EA6FF; --blue-ink: #0B1530; --blue-soft: #1D2A48;
  --gain: #54D6A0; --gain-soft: #123629; --gain-bar: #2FBF84;
  --prio: #FFC933; --prio-soft: #372E10; --prio-line: #E0AE1F;
  --stop: #FF8575; --stop-soft: #3B1D1A;
  --bar-buy: #D3DBEA; --bar-fees: #8594B2; --bar-transport: #5A6885; --bar-nego: #465471;
  --glass: #3C4D6B; --tyre: #05080F; --hub: #6B7890;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; background: var(--paper); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.45;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ---------- Coquille ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  background: color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { white-space: nowrap; display: flex; align-items: center; gap: 9px; font: 600 19px/1 var(--font-num); letter-spacing: .005em; color: var(--ink); text-decoration: none; }
.brand svg { width: 26px; height: 26px; flex: none; }
.topbar .base-pill { margin-left: auto; }
.base-pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; background: var(--surface); text-decoration: none; white-space: nowrap;
}
.base-pill svg { width: 14px; height: 14px; }
.base-pill.missing { border-color: var(--prio-line); background: var(--prio-soft); color: var(--ink); }

.rail {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.rail .brand, .rail .rail-foot { display: none; }
.nav { display: flex; height: var(--nav-h); }
.nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 11.5px; font-weight: 600; color: var(--muted); text-decoration: none; position: relative;
}
.nav a svg { width: 23px; height: 23px; }
.nav a[aria-current="page"] { color: var(--blue); }
.nav .badge {
  position: absolute; top: 6px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--prio); color: #231A00; font: 700 11px/18px var(--font-num); text-align: center;
}
main { width: 100%; max-width: 780px; margin: 0 auto; padding: 14px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }

@media (min-width: 960px) {
  .topbar { display: none; }
  .rail {
    top: 0; bottom: 0; right: auto; width: 236px; border-top: 0; border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 26px;
    padding: calc(env(safe-area-inset-top, 0px) + 22px) 14px calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  .rail .brand { white-space: nowrap; display: flex; padding: 0 10px; }
  .nav { flex-direction: column; height: auto; gap: 2px; }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 15.5px; font-weight: 500; padding: 10px 12px; border-radius: 10px; color: var(--ink-2); }
  .nav a:hover { background: var(--surface-2); }
  .nav a[aria-current="page"] { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .nav a svg { width: 20px; height: 20px; }
  .nav .badge { position: static; margin-left: auto; }
  .rail .rail-foot { display: block; margin-top: auto; padding: 0 10px; font-size: 13px; color: var(--muted); }
  .rail-foot .base-pill { margin-top: 6px; }
  body { padding-left: 236px; }
  main { padding: 34px 40px 60px; }
}

/* ---------- Titres et textes ---------- */
.page-head { margin: 6px 0 14px; }
h1 { font: 600 28px/1.12 var(--font-num); letter-spacing: -.005em; margin: 0 0 6px; }
h2 { font: 600 20px/1.2 var(--font-num); margin: 0 0 10px; }
h3 { margin: 0; }
.lede { margin: 0; color: var(--ink-2); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
section + section { margin-top: 26px; }

/* ---------- Contrôles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--blue); color: var(--blue-ink); }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-ghost { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
.btn-quiet { background: transparent; color: var(--ink-2); padding: 0 10px; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 10px; border: 0; background: transparent; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }

.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; background: none; border: 0; padding: 10px 0 9px; margin-bottom: -1px;
  border-bottom: 2.5px solid transparent; font-weight: 600; font-size: 15px; color: var(--muted);
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }
.tabs .count { font-family: var(--font-num); font-weight: 500; margin-left: 5px; color: var(--muted); }
@media (min-width: 960px) { .tabs { margin: 0; padding: 0; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0 14px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2);
  font-size: 14px; font-weight: 500;
}
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] { background: var(--prio-soft); border-color: var(--prio-line); color: var(--ink); font-weight: 600; }
.chip.sel[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip .count { font-family: var(--font-num); opacity: .75; }
.select-chip { position: relative; display: inline-flex; }
.select-chip select {
  appearance: none; -webkit-appearance: none; min-height: 36px; padding: 0 28px 0 11px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 500;
}
.select-chip svg { position: absolute; right: 10px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); pointer-events: none; color: var(--muted); }
.toolbar .spacer { flex: 1; }

/* ---------- Notes ---------- */
.note {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; margin: 0 0 12px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 14.5px; color: var(--ink-2);
}
.note > svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--muted); }
.note .note-body { flex: 1; min-width: 0; }
.note strong { color: var(--ink); }
.note .note-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.note.warn { border-color: var(--prio-line); background: var(--prio-soft); }
.note.warn > svg { color: var(--ink); }
.note.stop { border-color: color-mix(in srgb, var(--stop) 50%, var(--line)); background: var(--stop-soft); }
.note.stop > svg { color: var(--stop); }
.note.good { border-color: color-mix(in srgb, var(--gain) 45%, var(--line)); background: var(--gain-soft); }
.note.good > svg { color: var(--gain); }
.inline-form { display: flex; gap: 8px; flex-wrap: nowrap; }
.inline-form .input { width: 110px; flex: none; }
.note.compact { align-items: center; padding: 8px 8px 8px 14px; }
.note.compact > svg { margin-top: 0; }
.note.compact .note-body { font-size: 14px; }

/* ---------- Carte d'opportunité ---------- */
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 14px 12px;
}
.card + .card { margin-top: 10px; }
.card.prio { border-color: var(--prio-line); box-shadow: inset 5px 0 0 var(--prio); padding-left: 18px; }
.card.dim { opacity: .72; }
.card-top { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 2px 12px; align-items: start; }
.glyph { width: 58px; height: 26px; margin-top: 3px; }
.glyph svg { width: 100%; height: 100%; display: block; }
.card-title { font: 600 18px/1.15 var(--font-num); margin: 0; }
.card-link { all: unset; cursor: pointer; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: 14px; }
.card-link:focus-visible::after { outline: 2.5px solid var(--blue); outline-offset: 2px; }
.card-version { font-size: 14px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-price { font: 600 16px/1.2 var(--font-num); margin-top: 5px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-price s { color: var(--muted); font-weight: 500; font-size: 14px; }
.card-margin { text-align: right; }
.m-val { display: block; font: 700 25px/1 var(--font-num); color: var(--gain); letter-spacing: -.01em; white-space: nowrap; }
.m-val.neg { color: var(--stop); }
.m-val.flat { color: var(--ink-2); }
.m-lab { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px;
  font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.tag svg { width: 13px; height: 13px; }
.tag.prio { background: var(--prio-soft); color: var(--ink); }
.tag.drop { background: var(--gain-soft); color: var(--gain); }
.tag.warn { background: var(--prio-soft); color: var(--ink); }
.tag.stop { background: var(--stop-soft); color: var(--stop); }
.tag.info { background: var(--blue-soft); color: var(--blue); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.specs { display: flex; flex-wrap: wrap; gap: 3px 14px; list-style: none; margin: 10px 0 0; padding: 0; font-size: 14.5px; color: var(--ink-2); }
.specs b { font-weight: 600; color: var(--ink); font-family: var(--font-num); font-size: 15.5px; }
.specs .over { color: var(--stop); }

/* Répartition de la cote : l'élément signature */
.split { display: flex; height: 12px; border-radius: 4px; overflow: hidden; gap: 2px; margin-top: 14px; background: var(--surface); }
.split.lg { height: 18px; border-radius: 5px; }
.split span { display: block; min-width: 2px; }
.s-buy { background: var(--bar-buy); }
.s-fees { background: var(--bar-fees); }
.s-transport { background: var(--bar-transport); }
.s-nego { background: repeating-linear-gradient(135deg, var(--bar-nego) 0 2.5px, transparent 2.5px 5px); box-shadow: inset 0 0 0 1px var(--bar-nego); }
.s-gain { background: var(--gain-bar); }
.s-over { background: repeating-linear-gradient(135deg, var(--stop) 0 2.5px, transparent 2.5px 5px); box-shadow: inset 0 0 0 1px var(--stop); }
.split-legend { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.split-legend b { color: var(--ink-2); font-weight: 600; font-family: var(--font-num); font-size: 14px; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13.5px; color: var(--muted); margin-top: 10px; }
.card-foot .it { display: inline-flex; align-items: center; gap: 5px; }
.card-foot svg { width: 14px; height: 14px; }

.signal { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.signal i { display: block; width: 3.5px; border-radius: 1px; background: var(--line-strong); }
.signal i:nth-child(1) { height: 5px; } .signal i:nth-child(2) { height: 8.5px; } .signal i:nth-child(3) { height: 12px; }
.signal.l3 i { background: var(--gain); }
.signal.l2 i:nth-child(-n+2) { background: var(--ink-2); }
.signal.l1 i:nth-child(1) { background: var(--stop); }

.fb { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.fb { grid-template-columns: minmax(0, 1fr) minmax(0, 1.28fr) minmax(0, 1fr); }
.fb button { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.fb button {
  min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2);
  font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 4px; white-space: nowrap;
}
.fb button svg { width: 17px; height: 17px; flex: none; }
.fb button:hover { border-color: var(--line-strong); }
.fb button[data-val="interessant"][aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
.fb button[data-val="pas_interessant"][aria-pressed="true"] { background: var(--stop-soft); border-color: var(--stop); color: var(--stop); }
.fb button[data-val="achete"][aria-pressed="true"] { background: var(--gain-soft); border-color: var(--gain); color: var(--gain); }
@media (max-width: 370px) { .fb button { font-size: 13.5px; } .fb button svg { display: none; } }

.empty { text-align: center; padding: 34px 18px; border: 1px dashed var(--line-strong); border-radius: 14px; color: var(--ink-2); }
.empty h3 { font: 600 19px var(--font-num); color: var(--ink); margin-bottom: 6px; }
.empty p { margin: 0 auto 14px; max-width: 42ch; }
.empty .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ---------- Liste des annonces ---------- */
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search .input { padding-left: 40px; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row-item {
  all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center;
  width: 100%; padding: 11px 14px; border-top: 1px solid var(--line);
}
.row-item:first-child { border-top: 0; }
.row-item:hover { background: var(--surface-2); }
.row-item:focus-visible { outline: 2.5px solid var(--blue); outline-offset: -2.5px; }
.ri-title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri-sub { display: flex; flex-wrap: wrap; gap: 0 12px; font-size: 13.5px; color: var(--muted); margin-top: 1px; }
.ri-end { text-align: right; font-size: 13.5px; max-width: 42vw; }
.ri-end .v { font: 700 17px var(--font-num); display: block; }
.ri-end .v.gain { color: var(--gain); }
.ri-end .v.flat { color: var(--ink-2); font-weight: 600; }
.more { display: flex; justify-content: center; margin-top: 12px; }

/* ---------- Fiche détaillée (tiroir) ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; transition: opacity .22s ease; }
.scrim.open { opacity: 1; }
.sheet {
  position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; right: 0; background: var(--paper);
  display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.sheet.open { transform: none; }
.sheet-head {
  display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px 6px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.sheet-head .src { font-size: 14px; color: var(--muted); }
.sheet-head .btn { margin-left: auto; }
.sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 28px; }
.sheet-foot { padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px); border-top: 1px solid var(--line); background: var(--surface); }
.sheet-foot .fb { margin-top: 0; }
@media (min-width: 960px) {
  .sheet { left: auto; width: min(580px, 94vw); transform: translateX(100%); border-left: 1px solid var(--line); box-shadow: -18px 0 40px rgba(12, 18, 32, .12); }
  .sheet-body { padding: 22px 26px 34px; }
  .sheet-foot { padding-left: 26px; padding-right: 26px; }
}
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }

.d-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; align-items: end; }
.d-hero .glyph-lg { grid-column: 1 / -1; width: 128px; height: 54px; margin-bottom: 4px; }
.d-title { font: 600 26px/1.1 var(--font-num); margin: 0; }
.d-version { color: var(--muted); margin-top: 3px; }
.d-price { text-align: right; }
.d-price .p { font: 700 26px/1 var(--font-num); display: block; }
.d-price s { color: var(--muted); font-size: 14px; }

.receipt { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 2px 16px; }
.receipt .r { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 10px 0; border-bottom: 1px dashed var(--line-strong); }
.receipt .r:last-child { border-bottom: 0; }
.receipt .k { color: var(--ink-2); display: flex; align-items: center; gap: 9px; }
.receipt .k small { display: block; color: var(--muted); font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.comp-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 12px; }
.comp-table th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12.5px; padding: 0 6px 6px 0; }
.comp-table td { padding: 7px 6px 7px 0; border-top: 1px solid var(--line); font-family: var(--font-num); font-size: 15px; }
.comp-table td.t { font-family: var(--font); font-size: 13.5px; color: var(--ink-2); }

mark { background: var(--stop-soft); color: var(--stop); font-weight: 700; padding: 0 2px; border-radius: 3px; }

.input, select.input, textarea.input {

}
textarea.input { padding: 11px 12px; min-height: 110px; resize: vertical; line-height: 1.5; }
select.input { appearance: none; -webkit-appearance: none; padding-right: 36px; background-image: none; }
.input::placeholder { color: var(--muted); opacity: .8; }
.input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }

.field > label, .field > .label { font-weight: 600; font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.tag.confirm { background: var(--prio-soft); color: var(--ink); height: 20px; font-size: 12px; }

function deptOf(cp) {

  let d = cp.slice(0, 2);
  if (d === '20') d = (+cp < 20200) ? '2A' : '2B';
  return d;
}
function geocode(cp, ville) {
  cp = String(cp ?? '').trim();
  const v = ville ? strip(ville).trim() : '';
  const exact = CITIES.find(c => c[1] === cp) || (v && CITIES.find(c => strip(c[0]) === v && deptOf(c[1]) === deptOf(cp)));
  if (exact) return { lat: exact[2], lon: exact[3], approx: false, label: exact[0] };
  const d = deptOf(cp);
  if (d && DEPTS[d]) return { lat: DEPTS[d][0], lon: DEPTS[d][1], approx: true, label: DEPTS[d][2] };
  return null;
}

function kwRegex(kw) {
  const k = strip(kw).trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
  return new RegExp('(^|[^\\p{L}\\p{N}])(' + k + ')(?=$|[^\\p{L}\\p{N}])', 'u');
}
// Texte normalisé + table de correspondance vers l'original (pour surligner)
function normMap(text) {
  let out = ''; const map = [];
  for (let i = 0; i < text.length; i++) {
    const n = strip(text[i]);
    for (const ch of n) { out += ch; map.push(i); }
  }
  return { out, map };
}

function keywordRanges(text, kwList) {
  const { out, map } = normMap(text);
  const ranges = [];
  for (const { re } of kwList) {
    const g = new RegExp(re.source, 'gu');
    let m;
    while ((m = g.exec(out))) {
      const start = m.index + m[1].length, end = start + m[2].length;
      ranges.push([map[start], map[end - 1] + 1]);
      g.lastIndex = end;
    }
  }
  ranges.sort((a, b) => a[0] - b[0]);
  return ranges;
}

/* ---------- API du service ---------- */
class ApiError extends Error {
  constructor(status, message, data) { super(message); this.status = status; this.data = data; }
}
function detailText(d) {
  if (!d) return 'Erreur inattendue du serveur.';
  if (typeof d === 'string') return d;
  if (Array.isArray(d.messages)) return d.messages.join(' ; ');
  if (Array.isArray(d.errors)) return d.errors.join(' ; ');
  if (Array.isArray(d)) return d.map(x => x.msg || String(x)).join(' ; ');
  return JSON.stringify(d);
}
const Api = {
  async req(path, opts = {}) {
    let res;
    try {
      res = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...opts });
    } catch (e) {
      throw new ApiError(0, 'Connexion au serveur impossible. Vérifiez votre réseau.');
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== '/api/login') { showLogin(); throw new ApiError(401, 'Connexion requise.'); }
    if (!res.ok) throw new ApiError(res.status, detailText(data.detail), data.detail);
    return data;
  },
  get(path) { return this.req(path); },
  post(path, body) { return this.req(path, { method: 'POST', body: JSON.stringify(body) }); },
};

/* ---------- État ---------- */
const Store = { feedback: {} };
const S = {
  feedItems: [], byId: new Map(), evals: new Map(), detail: {}, cfgUsed: defaultConfig(), cfgErrors: null,
  ctx: { kwList: kwList(DEFAULT_KEYWORDS) }, loaded: false, loadError: null,
  view: null, sheetId: null, sheetFromApp: false, lastFocus: null,
  feed: { status: 'todo', period: 7, prioOnly: false, sort: 'marge' },
  list: { q: '', statut: 'all', offset: 0, items: [], counts: {}, total: 0, loading: false, error: null },
  stats: null, statsError: null, ev: null,
  cfgMeta: null, cfgDraftSource: null, draft: null, dirty: false, fieldErrors: {}, preview: null, saving: false,
};
const EMPTY_EV = { statut: 'non_evaluee', n: 0, comps: [], motif: null, niveau: null, cote: null, marge: null };

function ingest(items) {
  for (const it of items) {
    it.body = bodyFor(it.marque, it.modele);
    it.couleur = 'Gris';
    S.byId.set(it.id, it);
    S.evals.set(it.id, it.ev ? { ...it.ev, comps: [] } : EMPTY_EV);
    if (it.fb) Store.feedback[it.id] = it.fb; else delete Store.feedback[it.id];
  }
  return items;
}
async function loadConfig() {
  const r = await Api.get('/api/config');
  S.cfgMeta = r.meta;
  S.cfgDraftSource = r.draft;
  S.cfgErrors = r.errors && r.errors.length ? r.errors : null;
  S.cfgUsed = r.config ? { params: r.config.params, keywords: r.config.keywords, version: r.config.version } : defaultConfig();
  S.ctx = { kwList: kwList(S.cfgUsed.keywords) };
}
async function loadFeed() {
  const r = await Api.get(`/api/opportunities?period=${S.feed.period === 1 ? 1 : Math.max(S.feed.period, 7)}`);
  S.feedItems = ingest(r.items);
}
async function loadDetail(id) {
  const d = await Api.get('/api/listing/' + encodeURIComponent(id));
  ingest([d]);
  S.detail[id] = d;
  S.evals.set(id, { ...(d.ev || EMPTY_EV), comps: d.comps || [] });
  return d;
}
function todoCount(period = 7) {
  if (S.cfgErrors) return 0;
  const since = Date.now() - period * DAY;
  return S.feedItems.filter(l => S.evals.get(l.id).niveau && !Store.feedback[l.id] && l.first_seen_at >= since).length;
}
function emit() { refresh(); }

/* ---------- Connexion ---------- */
function showLogin(message) {
  document.body.classList.add('logged-out');
  $('#view').className = 'login';
  $('#view').innerHTML = `<form class="login-card" id="login-form" onsubmit="return false">
    <div class="brand">${DIAMOND(28)}Sourcing auto</div>
    <div class="field"><label for="pwd">Mot de passe</label><input id="pwd" class="input" type="password" autocomplete="current-password" required></div>
    <p class="err-msg" id="login-err"${message ? '' : ' hidden'}>${esc(message || '')}</p>
    <button type="submit" class="btn btn-primary" data-action="login">Se connecter</button>
  </form>`;
  setTimeout(() => { const i = $('#pwd'); if (i) i.focus(); }, 30);
}
async function doLogin() {
  const pwd = $('#pwd').value;
  try {
    await Api.post('/api/login', { password: pwd });
    document.body.classList.remove('logged-out');
    await boot();
  } catch (e) {
    const el = $('#login-err'); el.hidden = false; el.textContent = e.status === 401 ? 'Mot de passe incorrect.' : e.message;
  }
}
async function boot() {
  const s = await Api.get('/api/session').catch(() => ({ ok: false }));
  if (!s.ok) { showLogin(); return; }
  document.body.classList.remove('logged-out');
  S.view = null;
  $('#view').innerHTML = '<p class="muted" style="padding:40px 0">Chargement des annonces…</p>';
  try {
    await Promise.all([loadConfig(), loadFeed()]);
    S.loaded = true; S.loadError = null;
  } catch (e) {
    if (e.status === 401) return;
    S.loadError = e.message;
  }
  route();
}

/* ---------- Routage ---------- */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [a, ...rest] = h.split('/');
  return { a: a || 'opportunites', b: rest.length ? decodeURIComponent(rest.join('/')) : null };
}
function route() {
  if (document.body.classList.contains('logged-out')) return;
  const { a, b } = parseHash();
  if (a === 'annonce' && b) {
    if (!S.view) show('opportunites');
    openSheet(b);
    return;
  }
  if (S.sheetId) closeSheetDom();
  const v = VIEWS[a] ? a : 'opportunites';
  if (v !== S.view) show(v);
}
function show(v) {
  S.view = v;
  renderView();
  window.scrollTo(0, 0);
}
function renderView() {
  const main = $('#view');
  main.className = S.view === 'evaluer' ? 'wide' : '';
  main.innerHTML = S.loadError && S.view === 'opportunites'
    ? `<div class="note stop" style="margin-top:20px">${ICON.stop}<div class="note-body"><strong>Chargement impossible.</strong> ${esc(S.loadError)}<div class="note-actions"><button type="button" class="btn btn-ghost btn-sm" data-action="reload">Réessayer</button></div></div></div>`
    : VIEWS[S.view].render();
  if (VIEWS[S.view].after) VIEWS[S.view].after();
  updateChrome();
}
function refresh() {
  updateChrome();
  if (!S.view) return;
  if (S.view === 'evaluer') updateEvalResult();
  else if (S.view === 'annonces') updateList();
  else if (S.view === 'reglages') { if (!S.dirty) renderView(); }
  else { const y = window.scrollY; renderView(); window.scrollTo(0, y); }
  if (S.sheetId) renderSheet();
}
function updateChrome() {
  const { a } = parseHash();
  const cur = a === 'annonce' ? S.view : a;
  document.querySelectorAll('.nav a').forEach(el => {
    if (el.dataset.view === cur) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
  const n = todoCount(7);
  const badge = $('#nav-badge');
  badge.textContent = n > 99 ? '99+' : String(n);
  badge.hidden = n === 0;
  badge.setAttribute('aria-label', `${n} à traiter`);
  const pill = basePill();
  document.querySelectorAll('[data-slot="base"]').forEach(el => { el.innerHTML = pill; });
  $('#mode-line').innerHTML = '<button type="button" class="btn btn-quiet btn-sm" style="padding:0" data-action="logout">Se déconnecter</button>';
}
function basePill() {
  const cp = S.cfgUsed.params.base_code_postal;
  if (!cp) return `<a class="base-pill missing" href="#/reglages">${ICON.home}Base à renseigner</a>`;
  const g = geocode(cp);
  return `<a class="base-pill" href="#/reglages" title="Voir les réglages">${ICON.home}${esc(g ? g.label : '')} ${esc(cp)}</a>`;
}

const FB_LABELS = { interessant: 'Intéressant', pas_interessant: 'Pas intéressant', achete: 'Acheté' };
const FB_ICONS = { interessant: ICON.up, pas_interessant: ICON.x, achete: ICON.key };
const FIAB = {
  fiable: { l: 3, label: 'Cote fiable' },
  moyenne: { l: 2, label: 'Cote moyenne' },
  faible: { l: 1, label: 'Cote peu fiable' },
};
const PERIODS = { 1: 'les dernières 24 heures', 7: 'les 7 derniers jours', 30: 'les 30 derniers jours' };

function motifLabel(ev) {
  if (!ev.motif) return ev.statut === 'sous_seuil' ? 'Sous le seuil' : '';
  if (ev.motif.code === 'mot_cle') return `Mot-clé « ${ev.motif.detail} »`;
  return MOTIFS[ev.motif.code] || ev.motif.code;
}
function signal(fiab) {
  const f = FIAB[fiab];
  return f ? `<span class="signal l${f.l}" aria-hidden="true"><i></i><i></i><i></i></span>` : '';
}
function place(l, ev) {
  const where = l.ville ? `${esc(l.ville)}${l.cp ? ` (${esc(l.cp.slice(0, 2))})` : ''}` : 'Lieu inconnu';
  return ev.distance != null ? `${where}, à ${fmtNum(ev.distance)}${NB}km` : where;
}

function splitBar(l, ev, lg) {
  if (ev.cote == null || ev.marge == null) return '';
  const parts = [['s-buy', l.prix, 'Prix d’achat'], ['s-fees', ev.frais, 'Frais'], ['s-transport', ev.transport, 'Transport'], ['s-nego', ev.decote, 'Décote de revente']];
  const costs = parts.reduce((s, p) => s + p[1], 0);
  const total = Math.max(ev.cote, costs);
  if (ev.marge >= 0) parts.push(['s-gain', ev.marge, 'Marge']);
  const segs = parts.filter(p => p[1] > 0).map(([c, v, t]) => `<span class="${c}" style="flex:${(v / total).toFixed(4)} 1 0" title="${esc(t)} ${esc(fmtEur(v))}"></span>`).join('');
  const label = `Répartition de la cote de ${fmtEur(ev.cote)} : achat ${fmtEur(l.prix)}, frais ${fmtEur(ev.frais)}, transport ${fmtEur(ev.transport)}, décote ${fmtEur(ev.decote)}, marge ${fmtSigned(ev.marge)}.`;
  return `<div class="split${lg ? ' lg' : ''}" role="img" aria-label="${esc(label)}">${segs}</div>`;
}

function fbButtons(id) {
  const cur = Store.feedback[id] && Store.feedback[id].statut;
  return `<div class="fb" role="group" aria-label="Votre avis">${['interessant', 'pas_interessant', 'achete'].map(v =>
    `<button type="button" data-action="fb" data-id="${esc(id)}" data-val="${v}" aria-pressed="${cur === v}">${FB_ICONS[v]}${FB_LABELS[v]}</button>`).join('')}</div>`;
}

function thumb(l, big) {
  if (l.photo) return `<img class="${big ? 'hero-photo' : 'thumb'}" src="${esc(l.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${big ? 'glyph-lg' : 'glyph'}',innerHTML:carSVG({body:'${esc(l.body)}',couleur:'Gris'})}))">`;
  return `<div class="${big ? 'glyph-lg' : 'glyph'}">${carSVG(l)}</div>`;
}

function card(l) {
  const ev = S.evals.get(l.id);
  const fb = Store.feedback[l.id];
  const prio = ev.niveau === 'prioritaire';
  const hasM = ev.cote != null && ev.marge != null;
  const tags = [];
  if (prio) tags.push(`<span class="tag prio">${DIAMOND(13)}Prioritaire</span>`);
  if (l.prevPrice && l.prevPrice > l.prix) tags.push(`<span class="tag drop">${ICON.down}Baisse de ${esc(fmtEur(l.prevPrice - l.prix))}</span>`);
  if (!ev.niveau && ev.statut === 'sous_seuil') tags.push('<span class="tag">Sous le seuil</span>');
  if (ev.statut === 'exclue' || ev.statut === 'sans_cote') tags.push(`<span class="tag stop">${esc(motifLabel(ev))}</span>`);
  if (l.detailIndisponible) tags.push('<span class="tag warn">Description non vérifiée</span>');
  if (l.manual) tags.push('<span class="tag info">Saisie manuelle</span>');
  const kmAnOver = ev.kmAn != null && ev.kmAn > S.cfgUsed.params.km_par_an_max;
  return `<article class="card${prio ? ' prio' : ''}${fb && fb.statut === 'pas_interessant' ? ' dim' : ''}">
    <div class="card-top">
      ${thumb(l)}
      <div>
        <h3 class="card-title"><button type="button" class="card-link" data-action="open" data-id="${esc(l.id)}">${esc(l.marque)} ${esc(l.modele)}</button></h3>
        <div class="card-version">${esc(l.version || '')}</div>
        <div class="card-price">${esc(fmtEur(l.prix))}${l.prevPrice && l.prevPrice > l.prix ? `<s>${esc(fmtEur(l.prevPrice))}</s>` : ''}</div>
      </div>
      <div class="card-margin">${hasM
        ? `<span class="m-val${ev.marge < 0 ? ' neg' : ev.niveau ? '' : ' flat'}">${esc(fmtSigned(ev.marge))}</span><span class="m-lab">marge estimée</span>`
        : '<span class="m-val flat">—</span><span class="m-lab">non évaluable</span>'}</div>
    </div>
    <ul class="specs">
      <li><b>${l.annee ?? '—'}</b></li>
      <li><b>${fmtNum(l.km)}</b> km</li>
      <li${kmAnOver ? ' class="over"' : ''}><b>${fmtNum(ev.kmAn)}</b> km/an</li>
      <li>${esc(l.carburant)}</li><li>${l.boite === 'Automatique' ? 'Auto' : 'Manuelle'}</li>
    </ul>
    ${hasM ? `${splitBar(l, ev)}<div class="split-legend"><span>Achat <b>${esc(fmtEur(l.prix))}</b></span><span>Cote <b>${esc(fmtEur(ev.cote))}</b></span></div>` : ''}
    ${tags.length ? `<div class="tags">${tags.join('')}</div>` : ''}
    <div class="card-foot">
      <span class="it">${ICON.pin}${place(l, ev)}</span>
      ${ev.fiabilite ? `<span class="it">${signal(ev.fiabilite)}${FIAB[ev.fiabilite].label}, ${ev.n} ${plural(ev.n, 'comparable', 'comparables')}</span>` : ''}
      <span class="it">${ICON.clock}${ago(l.first_seen_at)}</span>
    </div>
    ${fbButtons(l.id)}
  </article>`;
}

function feedData() {
  const f = S.feed;
  const todo = [], byFb = { interessant: [], pas_interessant: [], achete: [] };
  for (const l of S.feedItems) {
    const fb = Store.feedback[l.id];
    if (fb && byFb[fb.statut]) { byFb[fb.statut].push(l); continue; }
    const ev = S.evals.get(l.id);
    if (!S.cfgErrors && ev.niveau && l.first_seen_at >= Date.now() - f.period * DAY) todo.push(l);
  }
  const sorters = {
    marge: (a, b) => (S.evals.get(b.id).marge ?? -1e9) - (S.evals.get(a.id).marge ?? -1e9),
    recent: (a, b) => b.first_seen_at - a.first_seen_at,
    distance: (a, b) => (S.evals.get(a.id).distance ?? 1e9) - (S.evals.get(b.id).distance ?? 1e9),
  };
  let items = f.status === 'todo' ? todo : byFb[f.status];
  const prioCount = todo.filter(l => S.evals.get(l.id).niveau === 'prioritaire').length;
  if (f.status === 'todo' && f.prioOnly) items = items.filter(l => S.evals.get(l.id).niveau === 'prioritaire');
  items = [...items].sort(sorters[f.sort] || sorters.marge);
  return { items, todo, byFb, prioCount };
}

function selectChip(action, value, options, label) {
  return `<label class="select-chip"><span class="sr-only">${esc(label)}</span><select data-action="${action}">${options.map(([v, t]) => `<option value="${v}"${String(v) === String(value) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>${ICON.chev}</label>`;
}

  }
  const toolbar = `<div class="toolbar">
    ${f.status === 'todo' ? `<button type="button" class="chip" data-action="prio" aria-pressed="${f.prioOnly}">${DIAMOND(15)}Prioritaires</button>
    ${selectChip('period', f.period, [[1, '24 heures'], [7, '7 jours'], [30, '30 jours']], 'Période')}` : ''}
    <span class="spacer"></span>
    ${selectChip('sort', f.sort, [['marge', 'Par marge'], ['recent', 'Par date'], ['distance', 'Par distance']], 'Trier')}
  </div>`;
  let list;
  if (items.length) list = items.map(card).join('');
  else if (f.status === 'todo' && f.prioOnly && todo.length) list = empty('Aucune alerte prioritaire', `Désactivez le filtre pour voir ${plural(todo.length, 'l’alerte normale', `les ${todo.length} alertes normales`)}.`, `<button type="button" class="btn btn-ghost" data-action="prio">Voir toutes les alertes</button>`);
  else if (f.status === 'todo') list = empty('Rien à traiter', `Aucune nouvelle annonce ne dépasse ${fmtEur(p.marge_min_eur)} de marge sur ${PERIODS[f.period]}.`, `${f.period < 30 ? '<button type="button" class="btn btn-ghost" data-action="period-30">Voir 30 jours</button>' : ''}<a class="btn btn-ghost" href="#/reglages">Ajuster la marge minimum</a><a class="btn btn-ghost" href="#/evaluer">Évaluer une annonce</a>`);
  else list = empty({ interessant: 'Aucune annonce intéressante', achete: 'Aucun achat enregistré', pas_interessant: 'Aucune annonce écartée' }[f.status],
    { interessant: 'Touchez Intéressant sur une opportunité pour la garder de côté ici.', achete: 'Touchez Acheté sur une opportunité : le prix payé alimente le suivi de la négociation.', pas_interessant: 'Les annonces marquées Pas intéressant apparaîtront ici.' }[f.status],
    '<button type="button" class="btn btn-ghost" data-action="tab" data-tab="todo">Voir les annonces à traiter</button>');
  return `<div class="page-head"><h1>Opportunités</h1><p class="lede">${lede}</p></div>
    ${notes.join('')}
    <div class="tabs" role="tablist" aria-label="Statut">${tabs.map(([k, t, n]) => `<button type="button" role="tab" data-action="tab" data-tab="${k}" aria-selected="${f.status === k}">${t}<span class="count">${n}</span></button>`).join('')}</div>
    ${toolbar}
    <div>${list}</div>`;
}
function empty(title, text, btns) {
  return `<div class="empty"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="btns">${btns || ''}</div></div>`;

/* ---------- Fiche détaillée ---------- */
function openSheet(id) {
  const sheet = $('#sheet'), scrim = $('#scrim');
  const wasOpen = !!S.sheetId;
  S.sheetId = id;
  if (!wasOpen) S.lastFocus = document.activeElement;
  renderSheet();
  if (!S.detail[id]) {
    loadDetail(id).then(() => { if (S.sheetId === id) renderSheet(); }).catch(e => {
      if (S.sheetId !== id) return;
      $('#sheet .sheet-body').innerHTML = `<div class="note stop">${ICON.stop}<div class="note-body"><strong>Annonce introuvable.</strong> ${esc(e.message)}</div></div>`;
    });
  }
  sheet.hidden = false; scrim.hidden = false;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => { sheet.classList.add('open'); scrim.classList.add('open'); });
  if (!wasOpen) setTimeout(() => { const b = $('#sheet [data-action="close-sheet"]'); if (b) b.focus({ preventScroll: true }); }, 60);
  $('#sheet .sheet-body').scrollTop = 0;
}
function closeSheet() {
  if (S.sheetFromApp) { S.sheetFromApp = false; history.back(); }
  else location.hash = '#/' + (S.view || 'opportunites');
}
function closeSheetDom() {
  const sheet = $('#sheet'), scrim = $('#scrim');
  S.sheetId = null;
  sheet.classList.remove('open'); scrim.classList.remove('open');
  document.body.style.overflow = '';
  const done = () => { if (!S.sheetId) { sheet.hidden = true; scrim.hidden = true; } };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) done(); else setTimeout(done, 320);
  if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus({ preventScroll: true });
}

function highlight(text, kwList) {
  const ranges = keywordRanges(text, kwList);
  let out = '', pos = 0;
  for (const [a, b] of ranges) {
    if (a < pos) continue;
    out += esc(text.slice(pos, a)) + '<mark>' + esc(text.slice(a, b)) + '</mark>';
    pos = b;
  }
  return out + esc(text.slice(pos));
}

function receipt(l, ev) {
  const p = S.cfgUsed.params;
  const n = ev.n;
  const rows = [
    ['', 'Cote de marché', `médiane de ${n} ${plural(n, 'comparable', 'comparables')}`, fmtEur(ev.cote)],
    ['s-nego', `Décote de revente ${fmtPct(p.decote_negociation_pct)}`, null, '−' + fmtEur(ev.decote)],
    ['sub', 'Prix de revente estimé', null, fmtEur(ev.revente)],
    ['s-buy', 'Prix d’achat', l.prevPrice > l.prix ? `affiché ${fmtEur(l.prevPrice)} auparavant` : 'prix affiché', '−' + fmtEur(l.prix)],
    ['s-fees', `Frais ${fmtPct(p.taux_frais_pct)}`, 'du prix d’achat', '−' + fmtEur(ev.frais)],
    ['s-transport', 'Transport', ev.distance != null ? `${fmtKm(ev.distance)} × ${nf2.format(p.cout_transport_eur_km)}${NB}€/km` : 'base non renseignée', Math.round(ev.transport) ? '−' + fmtEur(ev.transport) : fmtEur(0)],
  ];
  const html = rows.map(([c, k, sub, v]) => `<div class="r${c === 'sub' ? ' sub' : ''}"><span class="k">${c && c !== 'sub' ? `<span class="sw ${c}"></span>` : ''}<span>${esc(k)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></span><span class="v">${esc(v)}</span></div>`).join('');
  let th;
  if (ev.niveau === 'prioritaire') th = `Alerte prioritaire : la marge dépasse ${fmtEur(p.marge_prioritaire_eur)}.`;
  else if (ev.niveau === 'normale') th = `Alerte normale : il manque ${fmtEur(p.marge_prioritaire_eur - ev.marge)} pour passer prioritaire.`;
  else th = `Sous le seuil d’alerte : il manque ${fmtEur(p.marge_min_eur - ev.marge)} pour atteindre ${fmtEur(p.marge_min_eur)}.`;
  return `<div class="receipt">${html}<div class="r total"><span class="k"><span class="sw s-gain"></span>Marge nette estimée</span><span class="v${ev.marge < 0 ? ' neg' : ''}">${esc(fmtSigned(ev.marge))}</span></div></div>
    ${splitBar(l, ev, true)}<p class="threshold">${esc(th)}</p>`;
}

function niceTicks(a, b, n) {
  const span = b - a || 1;
  const step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0)), f = step0 / mag;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) out.push(v);
  return out;
}
function scatter(l, ev) {
  const W = 340, H = 190, pl = 60, pr = 12, pt = 14, pb = 30;
  const pts = ev.comps;
  const xs = pts.map(c => c.km).concat(l.km), ys = pts.map(c => c.prix).concat(l.prix, ev.cote);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const px = (x1 - x0) * .08 || 5000, py = (y1 - y0) * .1 || 800;
  x0 = Math.max(0, x0 - px); x1 += px; y0 = Math.max(0, y0 - py); y1 += py;
  const X = v => pl + (v - x0) / (x1 - x0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  const xt = niceTicks(x0, x1, 3), yt = niceTicks(y0, y1, 3);
  const grid = yt.map(v => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis-l" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${nf0.format(v)}${NB}€</text>`).join('')
    + xt.map(v => `<text class="axis-l" x="${X(v)}" y="${H - 10}" text-anchor="middle">${nf0.format(v)}${NB}km</text>`).join('');
  const dots = pts.map(c => `<circle class="dot${c.vendeur === 'pro' ? ' pro' : ''}" cx="${X(c.km).toFixed(1)}" cy="${Y(c.prix).toFixed(1)}" r="4"><title>${c.annee}, ${fmtKm(c.km)}, ${fmtEur(c.prix)}</title></circle>`).join('');
  const my = Y(ev.cote);
  const me = `<rect class="me" x="${X(l.km) - 6}" y="${Y(l.prix) - 6}" width="12" height="12" transform="rotate(45 ${X(l.km)} ${Y(l.prix)})"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prix des comparables selon le kilométrage, avec la cote et cette annonce">${grid}<line class="med" x1="${pl}" x2="${W - pr}" y1="${my}" y2="${my}"/><text class="med-l" x="${W - pr}" y="${my - 5}" text-anchor="end">Cote ${esc(fmtEur(ev.cote))}</text>${dots}${me}</svg>
    <div class="chart-legend"><span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" class="dot" style="fill:var(--bar-fees)"/></svg>Particulier</span><span><svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.6" style="fill:none;stroke:var(--bar-fees);stroke-width:1.5"/></svg>Professionnel</span><span>${DIAMOND(12)}Cette annonce</span></div>`;
}

function renderSheet() {
  const id = S.sheetId, l = S.byId.get(id);
  if (!l) {
    $('#sheet .sheet-head').innerHTML = `<button type="button" class="icon-btn" data-action="close-sheet" aria-label="Fermer la fiche">${ICON.back}</button>`;

  let status = '';
  if (ev.statut === 'exclue') status = `<div class="note stop">${ICON.stop}<div class="note-body"><strong>Exclue : ${esc(motifLabel(ev))}.</strong> ${esc(exclusionHelp(l, ev))}</div></div>`;

  const kmAnOver = ev.kmAn != null && ev.kmAn > p.km_par_an_max;
  const comps = [...ev.comps].sort((a, b) => Math.abs(a.km - l.km) - Math.abs(b.km - l.km));
  const fb = Store.feedback[id];
  const body = `
    <div class="d-hero">
      <div class="hero-media">${thumb(l, true)}</div>
      <div><h2 class="d-title" id="sheet-title">${esc(l.marque)} ${esc(l.modele)}</h2><div class="d-version">${esc(l.version || '')}</div></div>
      <div class="d-price"><span class="p">${esc(fmtEur(l.prix))}</span>${l.prevPrice > l.prix ? `<s>${esc(fmtEur(l.prevPrice))}</s>` : ''}</div>
    </div>
    <div class="tags">${tags.join('')}</div>
    ${fb && fb.statut === 'achete' ? `<div class="note good" style="margin-top:14px">${ICON.key}<div class="note-body"><strong>Achetée${fb.prix_achat ? ` ${esc(fmtEur(fb.prix_achat))}` : ''}.</strong>${fb.prix_achat ? ` Remise obtenue : ${esc(fmtEur(l.prix - fb.prix_achat))}.` : ''}</div></div>` : ''}
    <div style="margin-top:14px">${status}</div>
    ${ev.cote != null && ev.marge != null ? `<section><h2>Marge estimée</h2>${receipt(l, ev)}</section>` : ''}
    ${!detail && ev.n ? '<section><h2>Comparables</h2><p class="muted">Chargement des comparables…</p></section>' : ''}
    ${ev.comps.length && ci && ci.fiabilite ? `<section><h2>Comparables</h2><div class="panel">
      <p class="small" style="margin:0 0 10px;display:flex;gap:8px;align-items:flex-start">${signal(ci.fiabilite)}<span><strong>Marché actuel : ${FIAB[ci.fiabilite].label.toLowerCase()}.</strong> ${esc(fiabText(ci))}</span></p>
      ${ev.cote != null && (ci.n !== ev.n || Math.round(ci.cote) !== Math.round(ev.cote)) ? `<p class="small muted" style="margin:-4px 0 10px">L’évaluation a retenu une cote de ${esc(fmtEur(ev.cote))} sur ${ev.n} ${plural(ev.n, 'comparable', 'comparables')}. Le marché a évolué depuis : cote actuelle ${esc(fmtEur(ci.cote))}.</p>` : ''}
      ${scatter(l, { comps: ev.comps, cote: ci.cote })}
      <table class="comp-table"><thead><tr><th>Année</th><th>Kilométrage</th><th class="r">Prix</th><th>Vendeur</th></tr></thead><tbody>
      ${comps.slice(0, 8).map(c => `<tr><td>${c.annee}</td><td>${fmtNum(c.km)}</td><td class="r">${esc(fmtEur(c.prix))}</td><td class="t">${c.vendeur === 'pro' ? 'Pro' : 'Particulier'}, ${esc(c.ville)}</td></tr>`).join('')}
      </tbody></table>${comps.length > 8 ? `<p class="small muted" style="margin:8px 0 0">Et ${comps.length - 8} ${plural(comps.length - 8, 'autre', 'autres')}.</p>` : ''}
    </div></section>` : ''}
    <section><h2>Caractéristiques</h2><dl class="specs-grid">
      ${[['Année', l.annee ?? '—'], ['Kilométrage', fmtKm(l.km)], ['Kilomètres par an', `<span${kmAnOver ? ' style="color:var(--stop)"' : ''}>${fmtKm(ev.kmAn)}</span>`], ['Carburant', esc(l.carburant)], ['Boîte', esc(l.boite)], ['Couleur', esc(l.couleur || '—')],
        ['Localisation', `${esc(l.ville || '—')} ${esc(l.cp || '')}`], ['Distance de la base', ev.distance != null ? `${fmtKm(ev.distance)} par la route` : (p.base_code_postal ? 'Lieu inconnu' : 'Base non renseignée')],
        ['Première vue', esc(dtf.format(l.first_seen_at))], ['Dernière vue', esc(dtf.format(l.last_seen_at))]].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
    </dl></section>
    <section><h2>Description</h2>${detail ? (detail.description ? `<p class="desc">${highlight(detail.description, S.ctx.kwList)}</p>` : '<p class="muted">Description non disponible.</p>') : '<p class="muted">Chargement…</p>'}</section>
    <p class="meta">${ev.evaluatedAt ? `Évaluée le ${esc(dtf.format(ev.evaluatedAt))} avec la version ${esc(ev.configVersion || '')} des réglages.` : 'Pas encore évaluée.'}</p>`;

function fiabText(ev) {
  const p = S.cfgUsed.params, n = ev.n;
  if (ev.fiabilite === 'fiable') return `${n} annonces du même modèle, carburant et boîte, année ±1 et ±20${NB}000${NB}km, vues sur ${p.fenetre_comparables_jours} jours.`;
  if (ev.fiabilite === 'moyenne') return `Critères élargis à année ±2 et ±40${NB}000${NB}km pour réunir ${n} comparables.`;
  return `Seulement ${n} ${plural(n, 'comparable', 'comparables')}, même après élargissement. Vérifiez la cote avant d’appeler.`;
}
function exclusionHelp(l, ev) {
  const p = S.cfgUsed.params;
  switch (ev.motif.code) {
    case 'prix_hors_bornes': return `Le prix sort de la fourchette ${fmtEur(p.prix_min_eur)} à ${fmtEur(p.prix_max_eur)}.`;

    case 'km_max': return `Le kilométrage dépasse ${fmtKm(p.km_max)}.`;
    case 'km_par_an': return `${fmtKm(ev.kmAn)} par an, au-delà du maximum de ${fmtKm(p.km_par_an_max)}.`;
    case 'mot_cle': return 'Le mot-clé est surligné dans la description. S’il s’agit d’une fausse alerte, retirez-le des réglages.';
    case 'donnees_incompletes': return 'Le prix, l’année ou le kilométrage manque : l’annonce ne peut pas être évaluée.';
    default: return '';
  }
}

const FUELS = ['Essence', 'Diesel', 'Hybride', 'Électrique', 'GPL'];
function emptyEvalForm() {

const toInt = v => { const n = parseNumberFr(v); return isNaN(n) ? null : Math.round(n); };
function missingFields(e) {
  const miss = [];

function segCtl(name, value, options) {

function dayBars(perDay) {
  const days = 14, W = 340, H = 140, pl = 4, pb = 22, pt = 8;
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const t0 = start.getTime() - (days - 1) * DAY;
  const buckets = Array.from({ length: days }, (_, i) => ({ d: new Date(t0 + i * DAY), p: 0, n: 0 }));
  for (const r of perDay) {
    const i = Math.round((new Date(r.jour + 'T00:00:00').getTime() - t0) / DAY);
    if (i >= 0 && i < days) buckets[i][r.alert_level === 'prioritaire' ? 'p' : 'n'] += r.n;
  }
  const max = Math.max(3, ...buckets.map(b => b.p + b.n));
  const bw = (W - pl * 2) / days, Y = v => (H - pb - pt) * v / max;
  const bars = buckets.map((b, i) => {
    const x = pl + i * bw + 3, w = bw - 6, hn = Y(b.n), hp = Y(b.p);
    const lab = (days - 1 - i) % 2 === 0 ? `<text class="axis-l" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${b.d.getDate()}</text>` : '';
    return `<rect x="${x}" y="${H - pb - hn}" width="${w}" height="${hn}" rx="2" style="fill:var(--bar-fees)"><title>${b.n} normales</title></rect><rect x="${x}" y="${H - pb - hn - hp}" width="${w}" height="${hp}" rx="2" style="fill:var(--prio)"><title>${b.p} prioritaires</title></rect>${lab}`;
  }).join('');
  return { svg: `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Alertes par jour sur 14 jours"><line class="grid" x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}"/>${bars}</svg>
    <div class="chart-legend"><span><span class="sw" style="background:var(--prio)"></span>Prioritaires</span><span><span class="sw" style="background:var(--bar-fees)"></span>Normales</span></div>`, buckets };
}

    num[k] = n;

    ${stored}
    ${PARAM_GROUPS.map(g => `<div class="group"><h2>${esc(g.title)}</h2>${g.intro ? `<p>${esc(g.intro)}</p>` : ''}<div class="group-body">${g.keys.map(k => settingField(k, errs[k])).join('')}</div></div>`).join('')}
    <div class="group"><h2>Mots-clés d’exclusion</h2><p>Recherchés dans le titre et la description, sans tenir compte des accents ni des majuscules, sur des mots entiers.</p><div class="group-body"><div class="kw-editor" id="kw-editor">${kwEditor(errs.mots_cles_exclusion)}</div></div></div>
    <p class="small muted">${meta ? `Version ${meta.number}${meta.savedAt ? `, enregistrée le ${esc(dtf.format(meta.savedAt))}` : ''}. ` : ''}<button type="button" class="btn btn-quiet btn-sm" style="min-height:28px;padding:0 4px;color:var(--blue)" data-action="settings-defaults">Rétablir les valeurs initiales</button></p>
    <div class="savebar" id="savebar"${S.dirty ? '' : ' hidden'}>${savebarHtml(errs)}</div>`;
}
function savebarHtml(errs) {
  const n = Object.keys(errs).length;
  let txt;
  if (n) txt = `Corrigez ${plural(n, 'le champ en rouge', `les ${n} champs en rouge`)} pour enregistrer.`;
  else if (S.preview) txt = `Avec ces réglages : environ <b>${S.preview.n}</b> ${plural(S.preview.n, 'alerte', 'alertes')} sur 7 jours, dont ${S.preview.p} ${plural(S.preview.p, 'prioritaire', 'prioritaires')}. Actuellement : ${S.preview.current}.`;
  else txt = S.cfgMeta ? 'Calcul de l’impact…' : 'Prêt pour le premier enregistrement.';
  const cancel = S.cfgMeta ? '<button type="button" class="btn btn-quiet btn-sm" data-action="settings-cancel">Annuler</button>' : '';
  return `<span class="txt" aria-live="polite">${txt}</span>${cancel}<button type="button" class="btn btn-primary btn-sm" data-action="settings-save"${n || S.saving ? ' disabled' : ''}>${S.saving ? 'Enregistrement…' : 'Enregistrer'}</button>`;
}
function refreshSavebar() {
  const bar = $('#savebar');
  if (!bar) return;
  bar.hidden = !S.dirty;
  bar.innerHTML = savebarHtml(allErrors());
}
function refreshFieldErrors() {
  const errs = allErrors();
  for (const k of Object.keys(PARAM_META)) {
    const w = $('#w-' + k), e = $('#e-' + k);
    if (!w || !e) continue;
    w.classList.toggle('err', !!errs[k]);
    e.hidden = !errs[k]; e.textContent = errs[k] || '';
  }
}
let previewTimer = null, previewSeq = 0;
function schedulePreview() {
  S.preview = null;
  refreshSavebar();
  clearTimeout(previewTimer);
  if (Object.keys(clientErrors(S.draft)).length || !S.cfgMeta) return;
  previewTimer = setTimeout(async () => {
    const seq = ++previewSeq;
    try {
      const r = await Api.post('/api/config/preview', { params: S.draft.params, keywords: S.draft.keywords });
      if (seq === previewSeq) { S.preview = r; refreshSavebar(); }
    } catch (e) {
      if (seq === previewSeq && e.data && e.data.errors) { S.fieldErrors = e.data.errors; refreshFieldErrors(); refreshSavebar(); }
    }
  }, 500);
}
function onParamInput(el) {
  const key = el.dataset.param;
  S.draft.params[key] = el.type === 'checkbox' ? el.checked : el.value;
  delete S.fieldErrors[key];
  S.dirty = true;
  refreshFieldErrors();
  if (key === 'base_code_postal') {
    const h = $('#h-base_code_postal'), t = String(el.value).trim(), g = /^\d{5}$/.test(t) ? geocode(t) : null;
    if (h) h.textContent = g ? `${g.label}${g.approx ? ' (position approchée)' : ''}. ${PARAM_META.base_code_postal.help}` : PARAM_META.base_code_postal.help;
  }
  schedulePreview();
}
function addKeyword() {
  const i = $('#kw-new'), v = i.value.trim();
  if (!v) { i.focus(); return; }
  if (!S.draft.keywords.some(k => strip(k) === strip(v))) S.draft.keywords.push(v);
  S.dirty = true; refreshKw(); schedulePreview();
  $('#kw-new').focus();
}
function refreshKw() { $('#kw-editor').innerHTML = kwEditor(allErrors().mots_cles_exclusion); refreshSavebar(); }
async function saveSettings() {
  if (Object.keys(clientErrors(S.draft)).length || S.saving) return;
  S.saving = true; refreshSavebar();
  try {
    const r = await Api.post('/api/config', { params: S.draft.params, keywords: S.draft.keywords, based_on: S.cfgMeta ? S.cfgMeta.number : 0 });
    S.saving = false; S.dirty = false; S.preview = null; S.fieldErrors = {};
    await loadConfig();
    await loadFeed().catch(() => {});
    renderView();
    toast(`Réglages enregistrés, version ${r.meta.number}. Ils s’appliquent au prochain run.`);
  } catch (e) {
    S.saving = false;
    if (e.status === 422 && e.data && e.data.errors) { S.fieldErrors = e.data.errors; refreshFieldErrors(); refreshSavebar(); toast('Certaines valeurs sont refusées : voir les champs en rouge.'); }
    else { refreshSavebar(); toast(e.status === 409 ? e.message : 'Enregistrement impossible : ' + e.message); }
  }
}

/* ============================================================
   Retours (Intéressant, Pas intéressant, Acheté)
   ============================================================ */
async function sendFeedback(id, fb) {
  const prev = Store.feedback[id] || null;
  if (fb) Store.feedback[id] = fb; else delete Store.feedback[id];
  emit();
  try {
    await Api.post('/api/feedback', { id, statut: fb ? fb.statut : 'aucun', prix_achat: fb ? fb.prix_achat ?? null : null });
    return true;
  } catch (e) {
    if (prev) Store.feedback[id] = prev; else delete Store.feedback[id];
    emit();
    toast('Avis non enregistré : ' + e.message);
    return false;
  }
}
async function setFeedback(id, val) {
  const prev = Store.feedback[id] || null;
  if (prev && prev.statut === val) {
    if (await sendFeedback(id, null)) toast('Avis retiré : l’annonce est de nouveau à traiter', () => sendFeedback(id, prev));
    return;
  }
  if (val === 'achete') { openBuyDialog(id, prev); return; }
  if (await sendFeedback(id, { statut: val, at: Date.now() })) {
    toast(val === 'interessant' ? 'Marquée intéressante' : 'Marquée pas intéressante', () => sendFeedback(id, prev));
  }
}
function openBuyDialog(id, prev) {
  const l = S.byId.get(id);
  openDialog(`<h2 id="dlg-title">Marquer comme achetée</h2><p>${esc(l.titre || `${l.marque} ${l.modele}`)}, affichée ${esc(fmtEur(l.prix))}.</p>
    <div class="field"><label for="buy-price">Prix payé</label><div class="iw"><input id="buy-price" class="input" inputmode="numeric" value="${l.prix ? esc(nf0.format(l.prix)) : ''}" style="padding-right:34px"><span class="unit">€</span></div>
    <span class="help">Facultatif. Sert à mesurer la négociation obtenue dans le suivi.</span><span class="err-msg" id="buy-err" hidden></span></div>
    <div class="actions"><button type="button" class="btn btn-ghost" data-action="dlg-cancel">Annuler</button><button type="button" class="btn btn-primary" data-action="buy-confirm" data-id="${esc(id)}">Marquer achetée</button></div>`,
    w => { const i = $('#buy-price', w); i.focus(); i.select(); });
  S.buyPrev = prev;
}
async function confirmBuy(id) {
  const raw = $('#buy-price').value.trim();
  let price = null;
  if (raw) {
    price = toInt(raw);
    if (price == null || price <= 0) { const e = $('#buy-err'); e.hidden = false; e.textContent = 'Saisissez un montant en euros, ou laissez vide.'; return; }
  }
  const prev = S.buyPrev;
  closeDialog();
  if (await sendFeedback(id, { statut: 'achete', prix_achat: price, at: Date.now() })) {
    S.stats = null;
    toast('Marquée achetée', () => sendFeedback(id, prev));
  }
}

/* ============================================================
   Vues, événements, démarrage
   ============================================================ */
const VIEWS = {
  opportunites: { render: renderFeed },
  evaluer: { render: renderEvaluate, after: updateEvalResult },
  annonces: { render: renderListings, after: () => loadList(false) },
  suivi: { render: renderSuivi },
  reglages: { render: renderSettings },
};

async function reloadFeed() {
  try { await loadFeed(); S.loadError = null; } catch (e) { S.loadError = e.message; }
  renderView();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action], [data-ev-seg]');
  if (!t) return;
  if (t.dataset.evSeg) {
    S.ev[t.dataset.evSeg] = t.dataset.v;
    t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
    onEvInput(); return;
  }
  const a = t.dataset.action, id = t.dataset.id;
  switch (a) {
    case 'login': doLogin(); break;
    case 'logout': Api.post('/api/logout', {}).finally(() => showLogin()); break;
    case 'reload': boot(); break;
    case 'open': S.sheetFromApp = true; location.hash = '#/annonce/' + encodeURIComponent(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'fb': setFeedback(id, t.dataset.val); break;
    case 'tab': S.feed.status = t.dataset.tab; renderView(); break;
    case 'prio': S.feed.prioOnly = !S.feed.prioOnly; renderView(); break;
    case 'period-30': S.feed.period = 30; reloadFeed(); break;
    case 'toast-undo': if (toastUndo) { const u = toastUndo; toastUndo = null; u(); $('#toast').classList.remove('show'); } break;
    case 'dlg-cancel': closeDialog(); break;
    case 'buy-confirm': confirmBuy(id); break;
    case 'list-statut': S.list.statut = t.dataset.k; loadList(false); break;
    case 'list-more': S.list.offset += 50; loadList(true); break;
    case 'list-clear': S.list.q = ''; renderView(); break;
    case 'ev-clear': S.ev = emptyEvalForm(); renderView(); break;
    case 'ev-save': saveEval(); break;
    case 'settings-save': saveSettings(); break;
    case 'settings-cancel': S.dirty = false; S.preview = null; S.fieldErrors = {}; { const y = scrollY; renderView(); scrollTo(0, y); } break;
    case 'settings-defaults': S.draft = draftFromSource(null); S.draft.params.base_code_postal = S.cfgUsed.params.base_code_postal || ''; S.dirty = true; S.fieldErrors = {}; renderView(); schedulePreview(); break;
    case 'kw-add': addKeyword(); break;
    case 'kw-remove': S.draft.keywords.splice(+t.dataset.i, 1); S.dirty = true; refreshKw(); schedulePreview(); break;
    case 'ev-scroll': $('#eval-result').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-action="period"]')) { S.feed.period = +t.value; reloadFeed(); }
  else if (t.matches('[data-action="sort"]')) { S.feed.sort = t.value; renderView(); }
  else if (t.matches('select[data-ev]')) { S.ev[t.dataset.ev] = t.value; onEvInput(); }
  else if (t.matches('[data-param]') && (t.type === 'checkbox' || t.tagName === 'SELECT')) onParamInput(t);
});
let listTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-param]') && t.type !== 'checkbox' && t.tagName !== 'SELECT') { onParamInput(t); return; }
  if (t.matches('[data-ev]')) {
    S.ev[t.dataset.ev] = t.value;
    if (t.dataset.ev === 'marque') {
      const dl = $('#dl-modeles');
      if (dl) dl.innerHTML = [...new Set(MODELS.filter(m => strip(m.marque) === strip(t.value).trim()).map(m => m.modele))].map(m => `<option value="${esc(m)}">`).join('');
    }
    onEvInput();
  } else if (t.matches('[data-list-q]')) {
    S.list.q = t.value;
    clearTimeout(listTimer); listTimer = setTimeout(() => loadList(false), 300);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('#dialog').hidden) { closeDialog(); return; }
    if (S.sheetId) closeSheet();
  } else if (e.key === 'Enter') {
    if (e.target.id === 'pwd') { e.preventDefault(); doLogin(); }
    else if (e.target.id === 'kw-new') { e.preventDefault(); addKeyword(); }
    else if (e.target.id === 'buy-price') { e.preventDefault(); confirmBuy($('[data-action="buy-confirm"]').dataset.id); }
  }
});
$('#scrim').addEventListener('click', () => closeSheet());
$('#dialog').addEventListener('click', e => { if (e.target.id === 'dialog') closeDialog(); });
window.addEventListener('hashchange', route);
// Rafraîchit le fil toutes les 5 minutes quand l'onglet est visible.
setInterval(() => { if (!document.hidden && S.loaded && S.view === 'opportunites' && !S.sheetId) reloadFeed(); }, 5 * 60 * 1000);

boot();

['opps','calc','list','chart','sliders'].forEach(k => { const el = document.getElementById('ico-' + k); if (el) el.outerHTML = ICON[k]; });

</script>
</body>
