name: CI
on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint et format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typage
        run: uv run mypy src
      - name: Tests
        run: uv run pytest --cov --cov-report=term --cov-fail-under=60
      - name: Couverture du domaine (> 90 %)
        run: uv run pytest tests/unit/test_rules.py tests/unit/test_text_config.py --cov=car_sourcing.domain --cov-fail-under=90 -q
      - name: Construction de l'image
        run: docker build -t car-sourcing:ci .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -backend=false
      - run: terraform -chdir=infra validate
